  filename: "./log/douyin.log"
  max_size: 1000
  max_age: 3600
  max_backups: 5

# 对象存储：enabled=false 时降级到本地文件存储（通过 api 网关 /static/ 访问）
oss:
  enabled: false
  bucket_url: "https://tiktok-1319971229.cos.ap-nanjing.myqcloud.com/"
